name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-boot:
    name: build and boot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Handshake with live MCP
        run: bash .github/scripts/boot-proxy.sh node dist/index.js

  image:
    name: image build and boot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node pin matches .nvmrc
        run: |
          version="$(tr -d '[:space:]' < .nvmrc)"
          grep -q "^FROM node:${version}-alpine AS build$" Dockerfile
          grep -q "^FROM node:${version}-alpine AS runtime$" Dockerfile

      - name: Build image
        run: docker build -t opgg-mcp:ci .

      - name: Handshake image with live MCP
        run: bash .github/scripts/boot-proxy.sh docker run -i --rm opgg-mcp:ci
