name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-boot:
    name: build and boot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Boot proxy
        run: bash .github/scripts/boot-proxy.sh node dist/index.js

  image:
    name: image build and boot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t opgg-mcp:ci .

      - name: Boot image
        run: |
          set -euo pipefail
          docker run -d --name opgg-mcp-boot --init -i opgg-mcp:ci
          bash .github/scripts/boot-proxy.sh docker inspect-wait opgg-mcp-boot
